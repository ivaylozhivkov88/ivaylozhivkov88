<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="56" viewBox="0 0 1200 56" role="img" aria-label="APPS">
<defs><style>
.t{font-family:'Courier New',Consolas,'Liberation Mono',monospace;font-weight:700}
@keyframes walk{from{transform:translateX(-80px)}to{transform:translateX(1260px)}}
@keyframes hop{50%{transform:translateY(-6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes glow{50%{opacity:.55}}
</style></defs>
<rect width="1200" height="56" fill="#0A0F2A"/>
<rect x="6" y="20" width="16" height="16" fill="#39FF88"/>
<text x="36" y="35" class="t" font-size="22" fill="#DCE4FF" letter-spacing="4">APPS</text>
<line x1="122" y1="30" x2="1008" y2="30" stroke="#7F8BC0" stroke-width="3" stroke-dasharray="2 8"/>
<rect x="1032" y="12" width="162" height="32" fill="none" stroke="#22E6FF" stroke-width="2"/>
<text x="1047" y="34" class="t" font-size="16" fill="#22E6FF" letter-spacing="2">CLICK A CARD</text>
</svg>