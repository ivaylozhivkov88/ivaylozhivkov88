<line x1="140" y1="30" x2="953" y2="30" stroke="#7F8BC0" stroke-width="3" stroke-dasharray="2 8"/>
<rect x="977" y="12" width="217" height="32" fill="none" stroke="#FFD23F" stroke-width="2"/>
